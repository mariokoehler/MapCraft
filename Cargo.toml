[package]
name = "mapcraft"
version = "0.1.0"
edition = "2024"
rust-version = "1.95" # walkers 0.65 needs it
description = "Shows your photos on a world map: a Windows desktop app"
license = "MIT OR Apache-2.0"
repository = "https://github.com/mariokoehler/MapCraft"
publish = false

[dependencies]
directories = "6"
eframe = "0.37"
egui = "0.37"
egui_extras = { version = "0.37", default-features = false, features = ["svg"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
walkers = "0.65"

[dev-dependencies]
tempfile = "3"
