[package]
name = "mapcraft"
version = "0.1.0"
edition = "2024"
rust-version = "1.95" # walkers 0.65 needs it
description = "Shows your photos on a world map: a Windows desktop app"
license = "MIT OR Apache-2.0"
repository = "https://github.com/mariokoehler/MapCraft"
publish = false

[dependencies]
directories = "6"
eframe = "0.37"
egui = "0.37"
egui_extras = { version = "0.37", default-features = false, features = ["svg"] }
flate2 = "1"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "tiff", "webp"] }
jpeg-decoder = "0.3"
kamadak-exif = "0.6"
quick-xml = "0.42"
# Blocking HTTP for the place-name download; the same reqwest and rustls walkers uses.
reqwest = { version = "0.13", default-features = false, features = ["blocking", "rustls"] }
rfd = "0.18"
self-replace = "1.5"
rusqlite = { version = "0.42", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
toml = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
walkers = "0.65"
windows-sys = { version = "0.61", features = ["Win32_NetworkManagement_WNet", "Win32_Foundation", "Win32_System_Diagnostics_ToolHelp", "Win32_UI_WindowsAndMessaging", "Win32_Storage_FileSystem", "Win32_System_WindowsProgramming"] }
xxhash-rust = { version = "0.8", features = ["xxh3"] }

[build-dependencies]
winresource = "0.1.34"

[dev-dependencies]
egui_kittest = "0.37"
tempfile = "3"
