# cargo-about (https://github.com/EmbarkStudios/cargo-about): the licences of the crates built
# into mapcraft.exe, for THIRD-PARTY-NOTICES.txt beside each release (design.md M7).
# Regenerate: cargo about generate about.hbs -o THIRD-PARTY-NOTICES.txt
# A crate under a licence not listed here fails the generation: check it before adding it.
accepted = [
    "Apache-2.0",
    "MIT",
    "MIT-0",
    "ISC",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "Zlib",
    "Unicode-3.0",
    "MPL-2.0",
    "CDLA-Permissive-2.0",
    "OFL-1.1",
    "Ubuntu-font-1.0",
]
# Only what ends up in the exe: no build tools or test crates.
ignore-build-dependencies = true
ignore-dev-dependencies = true
targets = ["x86_64-pc-windows-msvc"]
